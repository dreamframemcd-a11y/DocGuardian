# =============================================================================
# DocGuardian — XcodeGen Project Configuration
# Generate .xcodeproj with: `xcodegen generate`  (run on macOS)
# Install XcodeGen:        `brew install xcodegen`
# =============================================================================
name: DocGuardian
options:
  bundleIdPrefix: com.docguardian
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""   # ← Fill in your Apple Dev Team ID before building
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    ENABLE_APP_SANDBOX: NO
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    # Background modes for remote notifications (if needed later)
    UIBackgroundModes: [remote-notification]

targets:
  DocGuardian:
    type: application
    platform: iOS
    # NOTE: `sources: DocGuardian` already pulls in Resources/Assets.xcassets
    # automatically. Do NOT also list it under `resources:`, otherwise Xcode
    # fails with "Multiple commands produce Assets.car".
    sources:
      - path: DocGuardian
        excludes:
          # Info.plist is injected via `info.path` below — excluding it here
          # prevents "Multiple commands produce Info.plist" build errors.
          - "Info.plist"
    info:
      path: DocGuardian/Info.plist
      properties:
        CFBundleDisplayName: DocGuardian
        CFBundleName: DocGuardian
        NSPhotoLibraryUsageDescription: "DocGuardian accesses your photo library to import documents for scanning."
        NSCameraUsageDescription: "DocGuardian uses the camera to scan paper documents."
        NSMicrophoneUsageDescription: "Not used."
        NSFaceIDUsageDescription: "Use Face ID to lock and unlock DocGuardian."
        NSLocationWhenInUseUsageDescription: "Not used."
        NSUserNotificationsUsageDescription: "DocGuardian sends reminders for upcoming bills and document deadlines."
        # Scene manifest is REQUIRED for SceneDelegate callbacks
        # (sceneWillEnterForeground / sceneDidEnterBackground used for CloudKit refresh).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        # Silent APNs pushes for CloudKit subscriptions.
        UIBackgroundModes: [remote-notification]
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.docguardian.app
        INFOPLIST_FILE: DocGuardian/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        CLANG_ANALYZER_NONNULL: YES
        CLANG_ENABLE_MODULES: YES
        ENABLE_MODULES: YES
    dependencies: []
    postBuildScripts: []

# Explicit shared scheme so CI can run `xcodebuild -scheme DocGuardian`.
schemes:
  DocGuardian:
    build:
      targets:
        DocGuardian: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
